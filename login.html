<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shree Hari Chasma Ghar | Login</title>
    <link rel="stylesheet" href="/assets/css/account.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ecf3ff, #dfeeff 45%, #f5f9ff);
        color: #1b2a3d;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .login-card {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(19, 44, 92, 0.16);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .brand-side {
        background: linear-gradient(135deg, #132746, #1f5fe5);
        color: #fff;
        padding: 38px 34px 28px;
        position: relative;
      }

      .brand-side::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top right, rgba(255,255,255,0.18), transparent 40%);
      }

      .brand-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .brand-tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      .brand-badge {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.28);
        background: rgba(255,255,255,0.12);
      }

      .brand-badge svg {
        width: 20px;
        height: 20px;
      }

      .brand-graphic {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 260px;
        padding: 24px 0;
      }

      .brand-graphic svg {
        width: min(100%, 360px);
        animation: floatUp 5s ease-in-out infinite;
      }

      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .brand-copy h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 3.3rem);
        line-height: 1.1;
      }

      .brand-copy p {
        margin: 0;
        color: rgba(255,255,255,0.82);
        line-height: 1.7;
        max-width: 430px;
      }

      .form-side {
        background: rgba(255,255,255,0.7);
        padding: 42px 34px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(39, 102, 241, 0.08);
        color: #1f57d7;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .eyebrow i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #17c0a4;
        display: inline-block;
        box-shadow: 0 0 0 5px rgba(23, 192, 164, 0.12);
      }

      .form-side h2 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 2.5vw, 2.5rem);
        color: #13233f;
      }

      .form-side p {
        margin: 0 0 22px;
        color: #566684;
      }

      #loginForm {
        display: grid;
        gap: 18px;
      }

      .field {
        position: relative;
      }

      .field svg {
        position: absolute;
        left: 16px;
        top: 50%;
        width: 20px;
        height: 20px;
        transform: translateY(-50%);
        stroke: #7b88a3;
        fill: none;
        stroke-width: 1.8;
      }

      .field input {
        width: 100%;
        height: 58px;
        border-radius: 14px;
        border: 1.5px solid rgba(122, 136, 163, 0.28);
        background: rgba(255,255,255,0.8);
        padding: 16px 16px 16px 48px;
        font-size: 1rem;
        outline: none;
        transition: 0.25s ease;
      }

      .field input:focus {
        border-color: rgba(31, 95, 229, 0.9);
        box-shadow: 0 0 0 5px rgba(31, 95, 229, 0.08);
      }

      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        font-size: 0.92rem;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #586887;
      }

      .remember input {
        accent-color: #1f5fe5;
      }

      .forgot {
        color: #1f57d7;
        text-decoration: none;
        font-weight: 600;
      }

      button[type="submit"] {
        height: 56px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, #1f5fe5, #123db3);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.25s ease;
        box-shadow: 0 14px 30px rgba(31, 95, 229, 0.22);
      }

      button[type="submit"]:hover {
        transform: translateY(-1px);
      }

      button[type="submit"]:disabled {
        cursor: not-allowed;
        opacity: 0.75;
        transform: none;
        box-shadow: none;
      }

      button[type="submit"] .btn-inner {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 0.7s linear infinite;
      }

      button[type="submit"].is-loading .spinner {
        display: inline-block;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #loginMessage {
        min-height: 22px;
        margin-top: 8px;
        text-align: center;
        font-size: 0.94rem;
        font-weight: 600;
      }

      .error {
        color: #c62828;
      }

      .success {
        color: #0d7a4d;
      }

      @media (max-width: 820px) {
        .login-card {
          grid-template-columns: 1fr;
        }

        .brand-side,
        .form-side {
          padding: 28px 20px;
        }
      }
    </style>
  </head>
  <!-- Worker API URL lives in assets/js/config.js only. -->
  <body>
    <div class="login-shell">
      <div class="login-card">
        <aside class="brand-side">
          <div class="brand-content">
            <div class="brand-tag">
              <span class="brand-badge">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 7.5A2.5 2.5 0 0 1 4.5 5h3.4a2.5 2.5 0 0 1 2.33 1.36L11 9.5h2l.77-3.14A2.5 2.5 0 0 1 16.1 5h3.4A2.5 2.5 0 0 1 22 7.5v9A2.5 2.5 0 0 1 19.5 19h-3.4a2.5 2.5 0 0 1-2.33-1.36L13 14.5h-2l-.77 3.14A2.5 2.5 0 0 1 7.9 19H4.5A2.5 2.5 0 0 1 2 16.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="7.2" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
                  <circle cx="16.8" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </span>
              Shree Hari Chasma Ghar
            </div>

            <div class="brand-graphic" aria-hidden="true">
              <svg viewBox="0 0 480 350" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="glassGrad" x1="0" x2="1">
                    <stop offset="0%" stop-color="#d9ebff"/>
                    <stop offset="100%" stop-color="#9ad8ff"/>
                  </linearGradient>
                </defs>
                <circle cx="240" cy="100" r="88" fill="rgba(255,255,255,0.08)"/>
                <g>
                  <rect x="110" y="128" width="122" height="72" rx="24" fill="url(#glassGrad)" opacity="0.95"/>
                  <rect x="250" y="128" width="122" height="72" rx="24" fill="url(#glassGrad)" opacity="0.95"/>
                  <path d="M232 161h18" stroke="#1a52d6" stroke-width="8" stroke-linecap="round"/>
                  <path d="M110 161H82" stroke="#1a52d6" stroke-width="8" stroke-linecap="round"/>
                  <path d="M398 161h28" stroke="#1a52d6" stroke-width="8" stroke-linecap="round"/>
                  <circle cx="170" cy="164" r="24" fill="rgba(255,255,255,0.12)"/>
                  <circle cx="310" cy="164" r="24" fill="rgba(255,255,255,0.12)"/>
                </g>
                <g>
                  <path d="M210 212c12 22 27 37 30 72 4 46 4 70 0 90H160c-4-34 0-62 10-95 9-30 21-47 40-67Z" fill="#f8d8bd"/>
                  <path d="M270 212c-12 22-27 37-30 72-4 46-4 70 0 90h80c4-34 0-62-10-95-9-30-21-47-40-67Z" fill="#f8d8bd"/>
                  <path d="M178 255c30 20 52 28 90 28s60-8 90-28" fill="none" stroke="#13233f" stroke-width="10" stroke-linecap="round"/>
                </g>
                <g>
                  <path d="M228 115c0-10 6-18 18-18s18 8 18 18" fill="none" stroke="#13233f" stroke-width="12" stroke-linecap="round"/>
                  <circle cx="214" cy="110" r="10" fill="#13233f"/>
                  <circle cx="266" cy="110" r="10" fill="#13233f"/>
                </g>
              </svg>
            </div>

            <div class="brand-copy">
              <h1>Welcome back.</h1>
              <p>Secure access for your optical store dashboard. Manage customers, orders, billing and reports in one place.</p>
            </div>
          </div>
        </aside>

        <section class="form-side">
          <span class="eyebrow"><i></i> secure access</span>
          <h2>Login</h2>
          <p>Use your shop credentials to continue.</p>

          <form id="loginForm">
            <div class="field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="username" name="username" autocomplete="username" placeholder="Username or email" required />
            </div>

            <div class="field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></svg>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required />
            </div>

            <div class="form-row">
              <label class="remember"><input type="checkbox" id="rememberMe" /> Remember me</label>
              <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" id="loginButton">
              <span class="btn-inner"><span class="spinner" aria-hidden="true"></span><span class="btn-text">Login</span></span>
            </button>
            <div id="loginMessage" aria-live="polite"></div>
          </form>
        </section>
      </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
