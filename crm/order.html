<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order Details | Shree Hari Chasma Ghar</title>
    <link rel="stylesheet" href="/assets/css/account.css" />
    <link rel="stylesheet" href="/assets/css/crm.css" />
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/crm-shell.js"></script>
    <script>
      document.documentElement.classList.add('auth-pending');
    </script>
  </head>
  <body>
    <div class="crm-app" id="crmShell"></div>

    <div id="pageContent" hidden>
      <div class="crm-error-banner" id="crmError"></div>

      <section class="crm-card" data-skeleton>
        <div class="crm-card-head">
          <div>
            <h1 style="margin:0; font-size:1.35rem;" id="orderTitle">Order</h1>
            <p id="orderSub">—</p>
          </div>
          <div class="order-actions">
            <a class="ghost-btn" id="backToCustomer" href="/crm/search.html" style="text-decoration:none; display:inline-flex; align-items:center;">Back to Customer</a>
          </div>
        </div>
      </section>

      <section class="crm-card" data-skeleton>
        <div class="crm-card-head"><h3>Customer</h3></div>
        <div class="order-info-grid">
          <div class="info-block"><div class="info-label">Name</div><div class="info-value" id="infoCustomerName">—</div></div>
          <div class="info-block"><div class="info-label">Mobile</div><div class="info-value" id="infoCustomerMobile">—</div></div>
          <div class="info-block"><div class="info-label">Address</div><div class="info-value" id="infoCustomerAddress">—</div></div>
        </div>
      </section>

      <section class="crm-card" data-skeleton>
        <div class="crm-card-head"><h3>Order Information</h3></div>
        <div class="order-info-grid">
          <div class="info-block"><div class="info-label">Order Date</div><div class="info-value" id="infoOrderDate">—</div></div>
          <div class="info-block"><div class="info-label">Bill No</div><div class="info-value" id="infoBillNo">—</div></div>
          <div class="info-block"><div class="info-label">Product</div><div class="info-value" id="infoProduct">—</div></div>
          <div class="info-block"><div class="info-label">Frame Type</div><div class="info-value" id="infoFrameType">—</div></div>
          <div class="info-block"><div class="info-label">Frame Size</div><div class="info-value" id="infoFrameSize">—</div></div>
          <div class="info-block"><div class="info-label">Frame Description</div><div class="info-value" id="infoDescFrame">—</div></div>
          <div class="info-block"><div class="info-label">Glass Description</div><div class="info-value" id="infoDescGlass">—</div></div>
        </div>
      </section>

      <section class="crm-card" data-skeleton id="prescriptionSection">
        <div class="crm-card-head"><h3>Prescription</h3></div>
        <div id="prescriptionContainer"></div>
      </section>

      <section class="crm-card" data-skeleton>
        <div class="crm-card-head"><h3>Price Breakdown</h3></div>
        <div class="price-breakdown" id="priceBreakdown"></div>
        <div style="margin-top:16px; font-size:1.3rem; font-weight:800; color:var(--dark);">
          Total: <span id="infoAmount">₹0</span>
        </div>
      </section>
    </div>

    <script src="/assets/js/crm-order.js"></script>
  </body>
</html>
