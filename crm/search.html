<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Search Customers | Shree Hari Chasma Ghar</title>
    <link rel="stylesheet" href="/assets/css/account.css" />
    <link rel="stylesheet" href="/assets/css/crm.css" />
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/crm-shell.js"></script>
    <script>
      document.documentElement.classList.add('auth-pending');
    </script>
  </head>
  <body>
    <div class="crm-app" id="crmShell"></div>

    <div id="pageContent" hidden>
      <section class="crm-welcome">
        <h1>Search Customers &amp; Orders</h1>
        <p>Find a customer by name or mobile — or find an order by bill number or order ID.</p>
      </section>

      <div class="crm-error-banner" id="crmError"></div>

      <section class="crm-card">
        <form class="search-bar" id="searchForm">
          <input type="search" id="searchInput" placeholder="Name, mobile, bill number or order ID..." autocomplete="off" />
          <button class="primary-btn" type="submit" id="searchButton">Search</button>
          <button class="ghost-btn" type="button" id="resetButton">Reset</button>
        </form>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Sr No</th><th>Customer</th><th>Mobile</th><th>Orders</th><th>Total Purchase</th><th>Last Order</th><th>Customer Since</th></tr>
            </thead>
            <tbody id="customerBody">
              <tr><td colspan="7" class="crm-empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pager">
          <button type="button" id="prevButton" disabled>← Previous</button>
          <span class="page-info" id="pageInfo"></span>
          <button type="button" id="nextButton" disabled>Next →</button>
        </div>

        <div class="form-message" id="pageMessage"></div>
      </section>
    </div>

    <script src="/assets/js/crm-search.js"></script>
  </body>
</html>
