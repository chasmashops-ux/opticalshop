<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Year-wise Report | Shree Hari Chasma Ghar</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png" />
    <link rel="icon" href="/assets/images/favicon/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/assets/css/account.css" />
    <link rel="stylesheet" href="/assets/css/crm.css" />
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/account-ui.js"></script>
    <script src="/assets/js/scroll-top.js"></script>
    <script>
      document.documentElement.classList.add('auth-pending');
      window.SHCG_AUTH.requireAuth();
    </script>
  </head>
  <body>
    <div class="crm-app">
      <div id="account-header"></div>

      <main class="crm-content">
        <section class="crm-welcome">
          <h1>Year-wise Statistics</h1>
          <p>Accounts created per year, grouped by the enterdate column in login_mst.</p>
        </section>

        <section class="kpi-grid">
          <div class="kpi-card kpi-accent-blue">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg></div>
            <div class="kpi-label">Total Users</div>
            <div class="kpi-value" id="statTotal">–</div>
          </div>
          <div class="kpi-card kpi-accent-violet">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></div>
            <div class="kpi-label">Years Covered</div>
            <div class="kpi-value" id="statYears">–</div>
          </div>
          <div class="kpi-card kpi-accent-green">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/></svg></div>
            <div class="kpi-label">Best Year</div>
            <div class="kpi-value" id="statBestYear">–</div>
          </div>
          <div class="kpi-card kpi-accent-amber">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></div>
            <div class="kpi-label">Average / Year</div>
            <div class="kpi-value" id="statAverage">–</div>
          </div>
        </section>

        <section class="crm-grid-2">
          <div class="crm-card">
            <div class="crm-card-head">
              <div>
                <h3>Users Added Per Year</h3>
              </div>
              <span class="badge" id="chartRange">—</span>
            </div>
            <div class="year-chart" id="yearChart"></div>
          </div>

          <aside class="crm-card">
            <div class="crm-card-head"><div><h3>Breakdown</h3></div></div>
            <div class="table-wrap">
              <table class="data-table" style="min-width: 0">
                <thead>
                  <tr><th>Year</th><th>Users</th><th>Share</th></tr>
                </thead>
                <tbody id="yearBody">
                  <tr><td colspan="3" class="crm-empty">Loading...</td></tr>
                </tbody>
              </table>
            </div>
            <div class="form-message" id="pageMessage"></div>
          </aside>
        </section>
      </main>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        var session = window.SHCG_ACCOUNT.init();
        if (!session) return;

        var escapeHtml = window.SHCG_ACCOUNT.escapeHtml;
        var chart = document.getElementById('yearChart');
        var tableBody = document.getElementById('yearBody');
        var message = document.getElementById('pageMessage');

        function setText(id, value) {
          document.getElementById(id).textContent = value;
        }

        try {
          var data = await window.SHCG_AUTH.authFetch('yearlyStats');
          var years = data.years;

          if (!years.length) {
            chart.innerHTML = '<div class="empty-state">' + escapeHtml(data.message || 'No dated records yet.') + '</div>';
            tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">No data.</td></tr>';
            setText('statTotal', '0');
            setText('statYears', '0');
            setText('statBestYear', '—');
            setText('statAverage', '0');
            return;
          }

          var total = years.reduce(function (sum, row) {
            return sum + row.total;
          }, 0);
          var max = Math.max.apply(
            null,
            years.map(function (row) {
              return row.total;
            })
          );
          var best = years.reduce(function (a, b) {
            return b.total > a.total ? b : a;
          });

          setText('statTotal', total.toLocaleString('en-IN'));
          setText('statYears', years.length);
          setText('statBestYear', best.year + ' (' + best.total + ')');
          setText('statAverage', Math.round(total / years.length));
          setText(
            'chartRange',
            years[years.length - 1].year + ' – ' + years[0].year
          );

          // Oldest year on the left so the chart reads left to right.
          var ascending = years.slice().reverse();

          chart.innerHTML = ascending
            .map(function (row) {
              var height = Math.max(6, Math.round((row.total / max) * 170));
              return (
                '<div class="year-column">' +
                '<span class="year-count">' + row.total + '</span>' +
                '<div class="year-bar" style="height:' + height + 'px" title="' + escapeHtml(row.year) + ': ' + row.total + ' users"></div>' +
                '<span class="year-label">' + escapeHtml(row.year) + '</span>' +
                '</div>'
              );
            })
            .join('');

          tableBody.innerHTML = years
            .map(function (row) {
              var share = total ? Math.round((row.total / total) * 100) : 0;
              return (
                '<tr><td class="cell-title" data-label="Year"><strong>' +
                escapeHtml(row.year) +
                '</strong></td><td data-label="Users">' +
                row.total +
                '</td><td data-label="Share"><span class="badge">' +
                share +
                '%</span></td></tr>'
              );
            })
            .join('');
        } catch (error) {
          message.textContent = error.message;
          message.className = 'form-message error';
          chart.innerHTML = '<div class="empty-state">Could not load statistics.</div>';
          tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">Could not load statistics.</td></tr>';
        }
      });
    </script>
  </body>
</html>
