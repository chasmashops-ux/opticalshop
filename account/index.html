<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Account Dashboard | Shree Hari Chasma Ghar</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png" />
    <link rel="icon" href="/assets/images/favicon/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/assets/css/account.css" />
    <link rel="stylesheet" href="/assets/css/crm.css" />
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/account-ui.js"></script>
    <script src="/assets/js/scroll-top.js"></script>
    <script>
      document.documentElement.classList.add('auth-pending');
      window.SHCG_AUTH.requireAuth();
    </script>
  </head>
  <body>
    <div class="crm-app">
      <div id="account-header"></div>

      <main class="crm-content">
        <section class="crm-welcome">
          <h1>Total Dashboard</h1>
          <p>Live totals from the <strong>shcg</strong> D1 database.</p>
        </section>

        <section class="kpi-grid">
          <div class="kpi-card kpi-accent-blue">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg></div>
            <div class="kpi-label">Total Users</div>
            <div class="kpi-value" id="statTotal">–</div>
          </div>
          <div class="kpi-card kpi-accent-violet">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></div>
            <div class="kpi-label">Added This Year (<span id="statYearLabel">–</span>)</div>
            <div class="kpi-value" id="statYear">–</div>
          </div>
          <div class="kpi-card kpi-accent-green">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="2"/></svg></div>
            <div class="kpi-label">Added This Month</div>
            <div class="kpi-value" id="statMonth">–</div>
          </div>
          <div class="kpi-card kpi-accent-amber">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></div>
            <div class="kpi-label">Years On Record</div>
            <div class="kpi-value" id="statYears">–</div>
          </div>
        </section>

        <section class="crm-grid-2">
          <div class="crm-card">
            <div class="crm-card-head">
              <div>
                <h3>Latest Users</h3>
                <p>Most recently added accounts.</p>
              </div>
              <a class="ghost-btn" href="/account/search-user.html" style="text-decoration: none; display: inline-flex; align-items: center;">Search Users</a>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr><th>ID</th><th>Username</th><th>Added On</th></tr>
                </thead>
                <tbody id="recentBody">
                  <tr><td colspan="3" class="crm-empty">Loading...</td></tr>
                </tbody>
              </table>
            </div>
            <div class="form-message" id="pageMessage"></div>
          </div>

          <aside class="crm-card">
            <div class="crm-card-head">
              <div>
                <h3>Quick Actions</h3>
              </div>
            </div>
            <div class="quick-actions">
              <a class="quick-action-btn" href="/account/add-user.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.9 3-6.5 6.5-6.5s6.5 2.6 6.5 6.5"/><path d="M18 8v6M15 11h6"/></svg>Add User</a>
              <a class="quick-action-btn" href="/account/search-user.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search User</a>
              <a class="quick-action-btn" href="/account/reports.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/></svg>Year-wise Statistics</a>
              <a class="quick-action-btn" href="#" data-logout><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Logout</a>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        var session = window.SHCG_ACCOUNT.init();
        if (!session) return;

        var escapeHtml = window.SHCG_ACCOUNT.escapeHtml;
        var message = document.getElementById('pageMessage');
        var recentBody = document.getElementById('recentBody');

        function setText(id, value) {
          document.getElementById(id).textContent = value;
        }

        try {
          var stats = await window.SHCG_AUTH.authFetch('stats');

          setText('statTotal', stats.totalUsers.toLocaleString('en-IN'));
          setText('statYearLabel', stats.currentYear);
          setText('statYear', stats.hasDateColumn ? stats.thisYear : 'n/a');
          setText('statMonth', stats.hasDateColumn ? stats.thisMonth : 'n/a');

          if (!stats.recent.length) {
            recentBody.innerHTML = '<tr><td colspan="3" class="crm-empty">No users found.</td></tr>';
          } else {
            recentBody.innerHTML = stats.recent
              .map(function (user) {
                return (
                  '<tr><td class="cell-hide-mobile" data-label="ID">' +
                  escapeHtml(user.id) +
                  '</td><td class="cell-title" data-label="Username"><strong>' +
                  escapeHtml(user.username) +
                  '</strong></td><td data-label="Added On">' +
                  escapeHtml(user.createdAt || '—') +
                  '</td></tr>'
                );
              })
              .join('');
          }

          var yearly = await window.SHCG_AUTH.authFetch('yearlyStats');
          setText('statYears', yearly.years.length);
        } catch (error) {
          message.textContent = error.message;
          message.className = 'form-message error';
          recentBody.innerHTML = '<tr><td colspan="3" class="empty-state">Could not load data.</td></tr>';
        }
      });
    </script>
  </body>
</html>
